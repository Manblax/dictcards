name: dictcards

services:
  postgres:
    image: postgres:15-alpine
    container_name: dictcards_db
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: dictcards_db
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U myuser -d dictcards_db']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    image: node:22-bookworm-slim
    container_name: dictcards_backend
    restart: always
    working_dir: /app
    env_file:
      - ./backend/.env
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://myuser:mypassword@postgres:5432/dictcards_db
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/auth/google/callback}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID:-}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET:-}
      YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL:-http://localhost:3001/auth/yandex/callback}
      DICTIONARY_SERVICE_URL: ${DICTIONARY_SERVICE_URL:-http://dictionary-service:4000}
      TTS_VOICE_UK: ${TTS_VOICE_UK:-en-GB-Chirp3-HD-Achernar}
      TTS_VOICE_US: ${TTS_VOICE_US:-en-US-Chirp3-HD-Achernar}
      DICTIONARY_CACHE_TTL_DAYS: 30
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run start:dev"
    ports:
      - '3001:3001'
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      dictionary-service:
        condition: service_started

  dictionary-service:
    image: node:22-bookworm-slim
    container_name: dictcards_dictionary_service
    restart: always
    working_dir: /app
    environment:
      PORT: 4000
      DICTIONARY_TIMEOUT_MS: 6000
    command: sh -c "npm install && npm run start:dev"
    expose:
      - '4000'
    volumes:
      - ./dictionary-service:/app
      - dictionary_service_node_modules:/app/node_modules

  frontend:
    image: node:22-bookworm-slim
    container_name: dictcards_frontend
    restart: always
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-http://backend:3001}
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0 --port 3000"
    ports:
      - '3000:3000'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  pgadmin:
    image: dpage/pgadmin4
    container_name: dictcards_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - '5050:80'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

volumes:
  postgres_data:
  backend_node_modules:
  dictionary_service_node_modules:
  frontend_node_modules:
  pgadmin_data:
