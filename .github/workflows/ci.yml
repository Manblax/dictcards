name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            path: backend
            lockfile: backend/package-lock.json
            test-command: npm test -- --runInBand
          - name: Dictionary Service
            path: dictionary-service
            lockfile: dictionary-service/package-lock.json
            test-command: npm test -- --runInBand
          - name: Frontend
            path: frontend
            lockfile: frontend/package-lock.json
            test-command: npm test
    env:
      DATABASE_URL: postgresql://myuser:mypassword@localhost:5432/flashcards_db
      JWT_SECRET: ci-jwt-secret
      FRONTEND_URL: http://localhost:3000
      GOOGLE_CALLBACK_URL: http://localhost:3001/auth/google/callback
      DICTIONARY_SERVICE_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.lockfile }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.path }}

      - name: Generate Prisma client
        if: ${{ matrix.path == 'backend' }}
        run: npx prisma generate
        working-directory: ${{ matrix.path }}

      - name: Build
        run: npm run build
        working-directory: ${{ matrix.path }}

      - name: Test
        run: ${{ matrix.test-command }}
        working-directory: ${{ matrix.path }}

      - name: Verify Prisma production dependency
        if: ${{ matrix.path == 'backend' }}
        run: |
          npm ci --omit=dev
          npx --no-install prisma validate
        working-directory: backend

  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    needs: ci
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      INTERNAL_API_URL: http://localhost:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Prepare country database
        run: npm run geoip:update

      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  production-config:
    name: Production configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate production Compose
        run: |
          docker compose \
            --env-file .env.production.example \
            -f docker-compose.production.yml \
            config --quiet

      - name: Confirm only Nginx publishes ports
        run: |
          published_ports="$(
            docker compose \
              --env-file .env.production.example \
              -f docker-compose.production.yml \
              config --format json |
              jq -r '
                .services
                | to_entries[]
                | select(.value.ports != null)
                | .key as $service
                | .value.ports[]
                | "\($service):\(.target)"
              ' |
              sort
          )"

          expected_ports=$'nginx:443\nnginx:80'
          if [[ "$published_ports" != "$expected_ports" ]]; then
            echo "::error::Only Nginx ports 80 and 443 may be published."
            printf 'Found:\n%s\n' "$published_ports"
            exit 1
          fi

      - name: Validate Nginx configuration and routing
        run: |
          certificate_dir="$RUNNER_TEMP/letsencrypt/live/flashcards2"
          rendered_config="$RUNNER_TEMP/nginx-rendered.conf"
          mkdir -p "$certificate_dir"
          openssl req \
            -x509 \
            -newkey rsa:2048 \
            -nodes \
            -days 1 \
            -subj "/CN=app.example.com" \
            -keyout "$certificate_dir/privkey.pem" \
            -out "$certificate_dir/fullchain.pem"

          docker run --rm \
            --add-host frontend:127.0.0.1 \
            --add-host backend:127.0.0.1 \
            -e FRONTEND_HOST=app.example.com \
            -e API_HOST=api.example.com \
            -e CLIENT_MAX_BODY_SIZE=10m \
            -e 'NGINX_ENVSUBST_FILTER=^(FRONTEND_HOST|API_HOST|CLIENT_MAX_BODY_SIZE)$' \
            -v "$GITHUB_WORKSPACE/deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro" \
            -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
            nginx:stable-alpine \
            nginx -T > "$rendered_config"

          grep -F 'server_name app.example.com api.example.com;' "$rendered_config"
          grep -F 'return 301 https://$host$request_uri;' "$rendered_config"
          grep -F 'proxy_pass http://frontend:3000;' "$rendered_config"
          grep -F 'proxy_pass http://backend:3001;' "$rendered_config"
          grep -F 'proxy_set_header X-Forwarded-Proto $scheme;' "$rendered_config"
          grep -F 'proxy_set_header X-Real-IP $remote_addr;' "$rendered_config"
          grep -F 'proxy_set_header Upgrade $http_upgrade;' "$rendered_config"
          grep -F 'client_max_body_size 10m;' "$rendered_config"
          grep -F 'location /.well-known/acme-challenge/' "$rendered_config"
